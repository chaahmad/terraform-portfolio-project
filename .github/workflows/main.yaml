# Workflow for Terraform process for infrastrcture management

name: Terraform Workflow #name of the workflow

on: #Coding for PR events
    pull_request:
        branches:
            - main
        paths:
            - 'terraform-nextjs/**'

jobs:
    terraform_init-to-terraform_plan:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./terraform-nextjs

        steps:
            - uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                aws-region: ca-central-1
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v4
            
            - name: Initialize, Format, Validate, and Plan Terraform
              run: |
                terraform init
                terraform fmt -check
                terraform validate
                terraform plan

