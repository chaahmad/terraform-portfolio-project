# Workflow for Terraform process for infrastrcture management

name: Terraform Workflow #name of the workflow

on: #PR event triggers Terraform process
    pull_request:
        branches:
            - main
        paths:
            - 'terraform-nextjs/**'
        types: [opened, synchronize, reopened, closed]

jobs:
    terraform_init-to-terraform_plan:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./terraform-nextjs

        steps:
            - uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                aws-region: ca-central-1
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v4
            
            - name: Initialize Terraform
              run: terraform init

            - name: Format Terraform code
              run: terraform fmt -check

            - name: Validate Terraform code
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan

    terraform_apply:
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true
        needs: terraform_init-to-terraform_plan
        defaults:
            run:
                working-directory: ./terraform-nextjs

        steps:
            - uses: actions/checkout@v7

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                aws-region: ca-central-1
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

            - name: Initialize Terraform
              run: terraform init

            - name: apply Terraform
              run: terraform apply -auto-approve